services:
  - type: web
    name: nil-valuation-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_API_KEY
        sync: false
      - key: CFB_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
